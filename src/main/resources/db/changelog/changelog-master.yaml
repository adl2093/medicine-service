databaseChangeLog:
  - changeSet:
      id: 1
      author: me
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS test;
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS test.medical_policies (
                person_id UUID PRIMARY KEY,
                policy_number TEXT NOT NULL CHECK (length(policy_number) = 6),
                created_at TIMESTAMP,
                updated_at TIMESTAMP,
                is_deleted BOOLEAN DEFAULT FALSE
              );

  - changeSet:
      id: 2
      author: me
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS test.idempotency_keys (
                id UUID PRIMARY KEY,
                created_at TIMESTAMP,
                updated_at TIMESTAMP,
                is_deleted BOOLEAN DEFAULT FALSE
              );

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.1.0'
}

group = 'ru.danil'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'org.liquibase:liquibase-core:5.0.3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

openApiGenerate {
	generatorName = "spring"
	inputSpec = file("${projectDir}/src/main/resources/openapi.yaml").absolutePath.replace('\\', '/')
	outputDir = layout.buildDirectory.dir("generated").get().asFile.path

	apiPackage = "ru.danil.medicine.api"
	modelPackage = "ru.danil.medicine.dto"

	configOptions = [
			requestMappingMode: "api_interface",
			skipDefaultInterface: "true",
			documentationProvider: "springdoc",
			library: "spring-boot",
			useTags: "true",
			interfaceOnly: "true",
			useSpringBoot3: "true",
			openApiNullable: "false"
	]
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
	main {
		java {
			srcDirs += layout.buildDirectory.dir("generated/src/main/java").get().asFile.path
		}
	}
}

compileJava.dependsOn tasks.openApiGenerate